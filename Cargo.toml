[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Only the parts the game uses: the defaults also build animation, picking, scenes, sprites,
# gizmos, Vorbis, clipboard and more. Tonemapping LUTs (with ktx2 and zstd) are what the default
# camera's tonemapping reads; audio is synthesized (`audio.rs`), so no decoder.
bevy = { version = "=0.19.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_state", "reflect_auto_register",
    "bevy_winit", "bevy_gilrs", "x11", "wayland", "default_font",
    "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_camera", "bevy_color", "bevy_image",
    "bevy_mesh", "bevy_shader", "bevy_material", "bevy_window", "bevy_mikktspace", "bevy_gltf",
    "tonemapping_luts", "ktx2", "zstd_rust", "png",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_audio",
] }
avian3d = { version = "=0.7.0", default-features = false }
glam = "0.32"
fastnoise-lite = "=1.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
planet_core = { path = "crates/planet_core" }
flight_core = { path = "crates/flight_core" }
walker_core = { path = "crates/walker_core" }
net_core = { path = "crates/net_core" }
warp_core = { path = "crates/warp_core" }
daynight_core = { path = "crates/daynight_core" }
grab_core = { path = "crates/grab_core" }
content_core = { path = "crates/content_core" }
gameplay_core = { path = "crates/gameplay_core" }
jobs_core = { path = "crates/jobs_core" }

# Bevy recommendation: little optimisation for our code, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Line tables keep file:line in backtraces; full debug info made each statically linked
# test binary 2 GB and its link take about 27 s.
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Optimised builds without LTO, for measurements and quick release-like runs.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
