[package]
name = "exo_app"
version = "0.1.0"
edition = "2024"

[features]
# Bevy's dynamic linking for faster incremental builds (dev only, never for release).
dynamic = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true }
avian3d = { workspace = true, features = ["3d", "f64", "parry-f64", "parallel", "default-collider"] }
planet_core = { workspace = true }
flight_core = { path = "../flight_core" }
walker_core = { path = "../walker_core" }
serde_json = "1"
