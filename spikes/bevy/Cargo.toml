[workspace]
resolver = "3"
members = ["flight_core", "walker_core", "net_core", "exo_app"]

[workspace.dependencies]
bevy = { version = "=0.19.1" }
avian3d = { version = "=0.7.0", default-features = false }
glam = "0.32"
planet_core = { path = "../planet_gen/rust/planet_core" }

# Bevy recommendation: little optimisation for our code, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Fast optimised builds for measurements (as in spike 8).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
