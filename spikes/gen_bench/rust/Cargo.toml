[workspace]
resolver = "2"
members = ["gen_core", "gen_bench_cli", "gen_godot"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Entwicklungsprofil mit schnellem Rebuild, aber optimiertem Generator-Code
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
