[package]
name = "exo_app"
version = "0.1.0"
edition = "2024"

[features]
# Bevy's dynamic linking for faster incremental builds (dev only, never for release).
dynamic = ["bevy/dynamic_linking"]
# Bevy Remote Protocol (BRP) for agents: HTTP on 127.0.0.1:15702. Dev only, never in release builds.
remote = ["dep:bevy_brp_extras"]

[dependencies]
bevy = { workspace = true }
avian3d = { workspace = true, features = ["3d", "f64", "parry-f64", "parallel", "default-collider"] }
planet_core = { workspace = true }
flight_core = { path = "../flight_core" }
walker_core = { path = "../walker_core" }
net_core = { path = "../net_core" }
serde_json = "1"
bevy_brp_extras = { version = "=0.22.10", optional = true }
